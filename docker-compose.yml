services:
  # ─── Redis (BullMQ + Distributed Locks) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: liman_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── NestJS API (Node.js event loop — только бизнес-логика) ──────────────────
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liman_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./data:/app/data            # SQLite + backups
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"                       # Не публикуем наружу — только через Nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Nginx (статика SPA + reverse proxy → NestJS) ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: liman_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro  # конфиг только для чтения
      - ./public/app:/app/static:ro                   # собранный Vite SPA (build output)
    depends_on:
      nestjs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
