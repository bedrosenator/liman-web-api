services:
  # ─── Redis (BullMQ + Distributed Locks) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: liman_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── PostgreSQL (Master DB: Tenants, Integrations, Product Mappings) ─────────
  postgres:
    image: postgres:16-alpine
    container_name: liman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liman_master}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-liman_master}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── NestJS API (Node.js event loop — только бизнес-логика) ──────────────────
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liman_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-liman_master}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data:/app/data            # backups & media
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "3000"                       # Не публикуем наружу — только через Nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Nginx (статика SPA + reverse proxy → NestJS) ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: liman_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro  # конфиг только для чтения
      - ./public/app:/app/static:ro                   # собранный Vite SPA (build output)
    depends_on:
      nestjs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
