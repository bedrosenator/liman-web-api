# ─── Nginx конфигурация для Liman Web API SPA ─────────────────────────────────
# Принцип: Nginx раздаёт статику SPA из /app/static напрямую (без Node.js),
# только /api/* запросы проксируются на NestJS (порт 3000).
# Это освобождает event loop от обработки статических файлов.
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'" always;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /app/static;

        # ─── 1. Статика SPA (кэш 1 год для хэшированных файлов) ─────────────
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ─── 2. API проксирование на NestJS ──────────────────────────────────
        location /api/ {
            proxy_pass         http://nestjs:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # Не кэшируем API ответы
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ─── 3. Медиа-файлы (через NestJS /media) ────────────────────────────
        location /media/ {
            proxy_pass         http://nestjs:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;

            # Кэш медиа на 1 день
            expires 1d;
            add_header Cache-Control "public";
        }

        # ─── 4. SPA fallback: все остальные пути → index.html ────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
        }

        # ─── 5. Health check для оркестрации ─────────────────────────────────
        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
