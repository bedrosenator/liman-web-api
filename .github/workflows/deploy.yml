name: Deploy Liman Web API to Production

on:
  push:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm ci

      - name: Run Backend Tests
        run: npm run test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Liman API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Переходим в директорию проекта на сервере
            PROJECT_DIR="/root/liman-web-api"
            if [ ! -d "$PROJECT_DIR" ]; then
              PROJECT_DIR="$HOME/liman-web-api"
            fi
            
            cd "$PROJECT_DIR" || {
              echo "❌ Директория $PROJECT_DIR не найдена. Проверьте путь клонирования репозитория на сервере Hetzner."
              exit 1
            }
            
            # 2. Обновляем кодовую базу и скрипты
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master
            
            # 3. Выставляем права на запуск скрипта развертывания
            chmod +x scripts/deploy.sh
            
            # 4. Запускаем деплой через Docker Compose
            ./scripts/deploy.sh

  cleanup:
    name: Clean Up Old Untagged Images
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      packages: write
    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'liman-web-api'
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: 'true'
